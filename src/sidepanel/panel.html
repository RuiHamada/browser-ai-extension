<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser AI Companion</title>
  <link rel="stylesheet" href="styles/base.css">
</head>
<body>
  <!-- ヘッダ -->
  <header class="header">
    <div class="header-logo">
      <span class="header-icon">AI</span>
      <span class="header-title">Browser AI Companion</span>
    </div>
    <div class="header-actions">
      <!-- 出力言語クイック切替（F-201） -->
      <label for="outputLanguageSelect" class="sr-only">Output language</label>
      <select id="outputLanguageSelect" title="Output language" aria-label="Output language">
        <option value="en">EN</option>
        <option value="ja">JA</option>
      </select>
      <button class="icon-btn" id="btnSettings" title="Settings">&#x2699;</button>
    </div>
  </header>

  <!-- 現在のページURL表示（F-009） -->
  <div class="url-bar">
    <span class="url-label">Page:</span>
    <span class="url-text" id="currentUrl">Loading...</span>
  </div>

  <!-- APIキー未設定の警告（F-010） -->
  <div id="apiKeyWarning" class="api-key-warning hidden">
    <div class="warning-icon">&#x26A0;</div>
    <div class="warning-body">
      <strong>API key is not configured.</strong>
      <p>Please set your Anthropic API key to use AI features.</p>
      <button class="btn btn-primary" id="linkToOptions" type="button">Open Settings</button>
    </div>
  </div>

  <!-- メインコンテンツ（APIキー設定済み時のみ表示）（F-401: 単一 Chat 画面） -->
  <div id="mainContent" class="main-content hidden">
    <!-- メッセージ領域: Welcome メッセージ + チャットバブル（F-401） -->
    <div class="chat-messages" id="chatMessages" aria-live="polite" aria-label="Chat history"></div>

    <!-- 短文警告ブロック（F-203 / F-402: "Explain page" クイックアクション時のみ） -->
    <div class="short-content-warning hidden" id="shortContentWarning" role="alert">
      <p class="warning-text" id="shortContentWarningText"></p>
      <div class="warning-actions">
        <button class="btn btn-primary" id="btnRunAnyway" type="button">Run anyway</button>
        <button class="btn btn-secondary" id="btnCancelShort" type="button">Cancel</button>
      </div>
    </div>

    <!-- クイックアクション行（F-402: 6 個のプリセットボタン） -->
    <div class="quick-actions" id="quickActions" aria-label="Quick actions">
      <button class="btn btn-quick" id="qaExplainPage" type="button">Explain page</button>
      <button class="btn btn-quick" id="qaExplainSelection" type="button">Explain selection</button>
      <button class="btn btn-quick" id="qaSummary" type="button">Summary</button>
      <button class="btn btn-quick" id="qaDetailed" type="button">Detailed</button>
      <button class="btn btn-quick" id="qaBeginner" type="button">Beginner-friendly</button>
      <button class="btn btn-quick" id="qaExpert" type="button">Expert-level</button>
    </div>

    <!-- 入力バー（F-401: Clear / textarea / Send の順） -->
    <div class="chat-input-area">
      <div class="chat-input-row">
        <button class="btn btn-secondary btn-clear" id="btnChatClear" type="button">Clear</button>
        <label for="chatInput" class="sr-only">Message</label>
        <textarea
          id="chatInput"
          class="chat-input"
          placeholder="Ask a follow-up question... (Enter to send, Shift+Enter for newline)"
          rows="2"
          aria-label="Chat message input"
        ></textarea>
        <button class="btn btn-primary btn-send" id="btnChatSend" type="button">Send</button>
      </div>
    </div>
  </div>

  <script type="module" src="/dist/sidepanel.js"></script>
</body>
</html>
